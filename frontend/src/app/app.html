@if (showChrome()) {
<app-header />
}

<main>
  <router-outlet />
</main>

@if (showChrome()) {
<app-footer />
}

<div class="toasts" aria-live="polite">
  @for (t of toast.items(); track t.id) {
  <div class="toast" [class.ok]="t.kind === 'ok'" [class.bad]="t.kind === 'bad'" [class.leaving]="t.leaving"
    [attr.role]="t.kind === 'bad' ? 'alert' : 'status'">
    <span class="ic" aria-hidden="true">{{ t.kind === 'ok' ? '✓' : '!' }}</span>
    <div>
      <b>{{ t.title }}</b>
      @if (t.message) { <span class="m">{{ t.message }}</span> }
    </div>
    <button type="button" class="x" aria-label="Dismiss notification" (click)="toast.dismiss(t.id)">✕</button>
  </div>
  }
</div>
