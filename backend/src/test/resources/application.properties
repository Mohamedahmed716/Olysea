spring.datasource.url=jdbc:h2:mem:olysea-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
olysea.bootstrap-admin.enabled=false
olysea.rate-limiting.contact-limit=100
olysea.rate-limiting.public-limit=100
olysea.rate-limiting.admin-limit=200
