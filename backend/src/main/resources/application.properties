spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/olyseadb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=OLYSEASESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Reverse proxy support
server.forward-headers-strategy=framework

# CORS
olysea.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Rate limiting
olysea.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
olysea.rate-limiting.public-limit=${RATE_LIMIT_PUBLIC:60}
olysea.rate-limiting.contact-limit=${RATE_LIMIT_CONTACT:5}
olysea.rate-limiting.admin-limit=${RATE_LIMIT_ADMIN:120}
olysea.rate-limiting.window-seconds=${RATE_LIMIT_WINDOW:60}

# Admin bootstrap
olysea.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
olysea.bootstrap-admin.email=${ADMIN_EMAIL:admin@olysea.tech}
olysea.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@Olysea2026!}
