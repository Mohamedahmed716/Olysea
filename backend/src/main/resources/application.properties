spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/olyseadb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
olysea.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
olysea.bootstrap-admin.email=${ADMIN_EMAIL:admin@olysea.tech}
olysea.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@Olysea2026!}
